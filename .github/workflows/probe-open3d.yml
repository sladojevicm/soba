# Open3D CI probe (maintainer decision 3, .claude/AGENTS.md): does the `recon`
# extra import on a plain Ubuntu runner with libgl1 + libglib2.0-0, and what
# does the full pytest suite do there? Runs only on the feat/docker branch; its
# findings are written to docs/ci-probe.md and it is deleted once ci.yml exists.
name: probe-open3d

on:
  push:
    branches: [feat/docker]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (as deploy/runpod/bootstrap.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Install soba [recon,serve,dev]
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[recon,serve,dev]"
          echo "::group::pip freeze"
          pip freeze
          echo "::endgroup::"

      - name: Import check
        run: |
          python -c "import open3d, cv2, trimesh, scipy, skimage, pymeshfix; print('open3d', open3d.__version__)"
          python -c "import cv2, trimesh, scipy, skimage, numpy; print('cv2', cv2.__version__, '| trimesh', trimesh.__version__, '| scipy', scipy.__version__, '| skimage', skimage.__version__, '| numpy', numpy.__version__)"

      - name: Open3D tensor backend (CPU:0, the TSDF fallback path)
        continue-on-error: true
        run: |
          python -c "import open3d as o3d; d=o3d.core.Device('CPU:0'); t=o3d.core.Tensor.zeros((2,2), device=d); print('tensor OK on', d, t.shape)"

      - name: Optional imports not in any extra (informational)
        continue-on-error: true
        run: |
          for m in coacd plyfile torch ultralytics sam2; do
            python -c "import $m; print('present: $m')" 2>/dev/null || echo "absent:  $m"
          done

      - name: pytest (full suite, no markers)
        id: pytest
        continue-on-error: true
        run: |
          pytest -q -rA --durations=15 --junitxml=probe-junit.xml

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-junit
          path: probe-junit.xml

      - name: Result
        if: always()
        run: |
          echo "pytest outcome = ${{ steps.pytest.outcome }}"
