<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- inline empty favicon: stops the browser's automatic /favicon.ico probe
       from 404ing against the scene server (console noise, fails the headless
       zero-page-errors check) -->
  <link rel="icon" href="data:," />
  <title>vid2sim — scene viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
    #c { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cdd3dc; background: rgba(20,22,27,.72); padding: 9px 11px;
      border-radius: 7px; max-width: 340px; pointer-events: none;
      white-space: pre-wrap;
    }
    #hud b { color: #fff; }
    .key { color: #ffb454; }
  </style>
  <!-- No bundler: ES module imports resolve through this import map to the
       vendored libraries served by the Step-10 server under /vendor/. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/",
      "@dimforge/rapier3d-compat": "/vendor/rapier/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
