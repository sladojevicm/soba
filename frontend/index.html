<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- inline empty favicon: stops the browser's automatic /favicon.ico probe
       from 404ing against the scene server (console noise, fails the headless
       zero-page-errors check) -->
  <link rel="icon" href="data:," />
  <title>vid2sim — scene viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
    #c { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cdd3dc; background: rgba(20,22,27,.72); padding: 9px 11px;
      border-radius: 7px; max-width: 340px; pointer-events: none;
      white-space: pre-wrap;
    }
    #hud b { color: #fff; }
    .key { color: #ffb454; }
    /* Ground-truth eval panel (only injected when /eval.json has results;
       fixed-position so scenes without one render with zero layout shift). */
    #evalPanel {
      position: fixed; top: 10px; right: 12px; z-index: 10;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cdd3dc; background: rgba(20,22,27,.82); border-radius: 7px;
      max-width: 360px; max-height: 80vh; overflow-y: auto;
    }
    #evalPanel summary {
      cursor: pointer; padding: 9px 11px; list-style: none; user-select: none;
      white-space: nowrap;
    }
    #evalPanel summary::before { content: "\25B8 "; color: #8a93a2; }
    #evalPanel details[open] summary::before { content: "\25BE "; }
    #evalPanel .body { padding: 0 11px 10px; }
    #evalPanel .score { font-weight: bold; color: #fff; }
    #evalPanel .good { color: #7dd97b; }
    #evalPanel .fair { color: #ffb454; }
    #evalPanel .poor { color: #ff6b6b; }
    #evalPanel table { border-collapse: collapse; width: 100%; margin-top: 4px; }
    #evalPanel td, #evalPanel th {
      padding: 1px 6px 1px 0; text-align: left; font-weight: normal;
      color: #cdd3dc; white-space: nowrap;
    }
    #evalPanel th { color: #8a93a2; border-bottom: 1px solid #2a2e35; }
    #evalPanel .dim { color: #8a93a2; }
  </style>
  <!-- No bundler: ES module imports resolve through this import map to the
       vendored libraries served by the Step-10 server under /vendor/. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/",
      "@dimforge/rapier3d-compat": "/vendor/rapier/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">loading…</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
