[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soba"
version = "0.0.1"
description = "Soba — video-to-simulation pipeline (scene.json contract)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",          # server tests (TestClient + real-server SSE)
]
# Step-10 local scene server (Phase 10). Built on Starlette (FastAPI's core)
# rather than FastAPI itself — Starlette + uvicorn + sse-starlette are the
# minimal set that gives the §15 routes + SSE.
serve = [
    "starlette>=0.37",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]
# Heavy, host-side reconstruction deps (CUDA recommended for TSDF). Kept
# optional so the contract + data-input layers install and test without them.
recon = [
    "open3d>=0.18",
    "opencv-python>=4.9",
    "trimesh>=4.0",
    "pillow>=10.0",
    "scipy>=1.11",          # fusion.py field blend; patchcomplete cKDTree
    "scikit-image>=0.22",   # marching-cubes (fusion + patchcomplete mesh extract)
    "pymeshfix>=0.16",      # Option D geometric watertight repair (keep-band)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Needs torch and/or a model checkout (MASt3R, SAM2, ...) that only the GPU
    # machine has. tests/conftest.py skips these when SOBA_SKIP_GPU_TESTS=1
    # (set by .github/workflows/ci.yml); they run unchanged everywhere else.
    "gpu: needs torch and/or a model checkout (skipped in CI via SOBA_SKIP_GPU_TESTS=1)",
]

# CI lint baseline (docker-agent, 2026-09-11): only syntax errors (E9) and
# pyflakes (F) — undefined names, unused imports/variables. Style rules are
# deliberately NOT enabled so the check never blocks on formatting.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
